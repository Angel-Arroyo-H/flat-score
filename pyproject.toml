[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flat-score"
version = "0.1.0"
description = "Transformação numérica para converter probabilidades preditas em scores com uma Distribuição Uniforme Contínua."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Angel Arroyo Hinostroza", email = "angel.arroyo.h@gmail.com" }
]
keywords = ["uniformizer", "predict", "gmm", "score", "uniform-transformation", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.23.5",
    "scipy>=1.9.3",
    "scikit-learn>=1.2"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["uniformizer*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]